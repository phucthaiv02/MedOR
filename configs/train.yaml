base_model: unsloth/Qwen3-8B

train_csv: datasets/train.csv
val_csv: null
val_split: 0.05
train_sample_limit: null  # đặt số nguyên để chỉ train trên tập con (thử nghiệm nhanh); null = dùng toàn bộ

max_seq_length: 4096
load_in_4bit: false
seed: 42

lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

output_dir: outputs/qwen3-medor-lora
merged_dir: outputs/qwen3-medor-merged

num_train_epochs: 3
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 0.0002
warmup_ratio: 0.03
lr_scheduler_type: cosine
weight_decay: 0.01
logging_steps: 10
save_steps: 200
save_total_limit: 5
eval_steps: 200
packing: false

report_to: wandb
wandb_project: medor-qwen3
wandb_run_name: null

push_to_hub: true
hub_model_id: phucthaiv02/medor-qwen3-lora
hub_private: false
hub_token: null
hub_strategy: all_checkpoints  # push từng checkpoint lên nhánh mặc định (main) trong lúc train
hub_merged_branch: merged      # model merge cuối cùng push lên nhánh riêng, tách khỏi các checkpoint
