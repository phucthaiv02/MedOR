base_model: unsloth/Qwen3-4B

train_csv: datasets/train.csv
val_csv: datasets/test.csv
val_split: 0.05
train_sample_limit: null  # đặt số nguyên để chỉ train trên tập con (thử nghiệm nhanh); null = dùng toàn bộ

max_seq_length: 2048
load_in_4bit: false
seed: 42

lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

# Generation-based eval: runs actual decoding (not just teacher-forced loss) on a slice
# of the val set every eval_steps, logging eval_precision/recall/f1/exact_match/wer/assertion_accuracy.
generation_eval:
  enabled: true
  max_samples: 50  # null = full val set (slower); raise for a more reliable signal
  max_new_tokens: 2048
  batch_size: 8
  match_mode: text_type

output_dir: outputs/qwen3-4b-medor-lora
merged_dir: outputs/qwen3-4b-medor-merged

num_train_epochs: 3
per_device_train_batch_size: 64
gradient_accumulation_steps: 1
learning_rate: 0.0002
warmup_ratio: 0.03
lr_scheduler_type: cosine
weight_decay: 0.01
logging_steps: 10
save_steps: 100
save_total_limit: 5
eval_steps: 100
packing: false

report_to: wandb
wandb_project: medor-qwen3
wandb_run_name: null

push_to_hub: true
hub_model_id: phucthaiv02/medor-qwen3-4b-lora
hub_private: false
hub_token: null
hub_strategy: all_checkpoints  # push từng checkpoint lên nhánh mặc định (main) trong lúc train
hub_merged_branch: merged      # model merge cuối cùng push lên nhánh riêng, tách khỏi các checkpoint
