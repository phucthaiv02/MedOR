base_model: unsloth/Qwen3-8B
lora_path: outputs/qwen3-medor-lora
merged_model_path: outputs/qwen3-medor-merged

input_dir: datasets/test
output_dir: outputs/predictions
limit: null

max_model_len: 4096
gpu_memory_utilization: 0.85
tensor_parallel_size: 1
guided_decoding: true

sampling:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 2048
  repetition_penalty: 1.05
  frequency_penalty: 0.1
  stop:
    - "<|im_end|>"
    - "<|endoftext|>"

# Candidate retrieval (optional): for each entry below, entities of
# `entity_type` are matched via SapBERT embedding similarity against
# `csv_path` (columns: name, code), and the top-k closest codes are attached
# as a `candidates` field. Leave candidate_kbs empty to skip this step.
embedding_model: cambridgeltl/SapBERT-UMLS-2020AB-all-lang-from-XLMR
candidate_top_k: 1
candidate_kbs:
  - entity_type: CHẨN_ĐOÁN
    csv_path: datasets/disease.csv
  - entity_type: THUỐC
    csv_path: datasets/drug.csv
