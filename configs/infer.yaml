# base_model is also loaded fresh (no lora/merge) for the type-classification
# step, so it must stay the original, non-fine-tuned checkpoint.
base_model: unsloth/Qwen3-4B
lora_path: outputs/qwen3-4b-medor-lora
merged_model_path: outputs/qwen3-4b-medor-merged

input_dir: datasets/test
output_dir: outputs/predictions
limit: null

max_model_len: 4096
gpu_memory_utilization: 0.85
tensor_parallel_size: 1
guided_decoding: false

# Concurrency tuning: raise these to let vLLM run more samples at once on the
# GPU (bounded by KV-cache capacity from gpu_memory_utilization/max_model_len).
# Leave null to use vLLM's defaults.
max_num_seqs: 256
max_num_batched_tokens: null

# LoRA rank passed to vLLM's max_lora_rank. Must match (or exceed) lora.r in
# configs/train.yaml (currently 32), else vLLM errors with "LoRA rank X is
# greater than max_lora_rank Y". Must be one of vLLM's supported values:
# 8, 16, 32, 64, 128, 256.
max_lora_rank: 32

sampling:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 2048
  repetition_penalty: 1.0
  frequency_penalty: 0.0
  stop:
    - "<|im_end|>"
    - "<|endoftext|>"

# Candidate retrieval (optional): for each entry below, entities of
# `entity_type` are matched via SapBERT embedding similarity against
# `csv_path` (columns: name, code), and the top-k closest codes are attached
# as a `candidates` field. Leave candidate_kbs empty to skip this step.
embedding_model: cambridgeltl/SapBERT-UMLS-2020AB-all-lang-from-XLMR
candidate_top_k: 1
candidate_kbs:
  - entity_type: CHẨN_ĐOÁN
    csv_path: datasets/disease.csv
  - entity_type: THUỐC
    csv_path: datasets/drug.csv
